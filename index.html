<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Breakthrough Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap');
        
        :root {
            --gold: #C5A059;
            --dark: #0A0A0A;
        }
        
        body {
            background-color: var(--dark);
            color: white;
            font-family: 'Inter', sans-serif;
        }

        .serif { font-family: 'Bodoni Moda', serif; }
        
        .gold-gradient {
            background: linear-gradient(135deg, #C5A059 0%, #F1D39B 50%, #C5A059 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-gold {
            background: var(--gold);
            transition: all 0.3s ease;
        }

        .btn-gold:hover {
            background: #D4B475;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(197, 160, 89, 0.2);
        }

        #loading-spinner {
            border: 3px solid rgba(197, 160, 89, 0.1);
            border-left-color: var(--gold);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="text-center mb-12">
        <span class="text-[10px] uppercase tracking-[0.3em] text-gray-500 mb-4 block">The World's First AI Personal Coach</span>
        <h1 class="serif text-4xl md:text-6xl mb-4">The Breakthrough Engine</h1>
        <p class="text-gray-400 font-light tracking-wide italic">Identify your blocks. Name your patterns. Build your protocol.</p>
    </div>

    <div id="app-container" class="w-full max-w-md space-y-6">
        <div class="space-y-4">
            <input type="text" id="userName" placeholder="Your Name" 
                   class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-4 focus:outline-none focus:border-[#C5A059]/50 transition-colors">
            
            <button onclick="startAnalysis()" id="submitBtn"
                    class="w-full btn-gold text-black font-semibold py-4 rounded-lg uppercase tracking-widest text-sm">
                Begin Breakthrough Analysis
            </button>
        </div>
    </div>

    <div id="loading" class="hidden flex flex-col items-center space-y-4 mt-8">
        <div id="loading-spinner"></div>
        <p class="text-xs uppercase tracking-widest text-[#C5A059] animate-pulse">Analyzing Patterns...</p>
    </div>

    <div id="result" class="hidden w-full max-w-2xl mt-12 p-8 border border-white/10 rounded-2xl bg-white/5 backdrop-blur-xl">
        <div id="resultContent" class="serif text-lg leading-relaxed text-gray-200"></div>
    </div>

    <script>
        async function startAnalysis() {
            const name = document.getElementById('userName').value;
            if (!name) return alert('Please enter your name');

            // UI Switch
            document.getElementById('app-container').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('result').classList.add('hidden');
            document.getElementById('submitBtn').innerText = 'Processing...';

            try {
                // Vercel-ийн Environment Variable-аас түлхүүрийг автоматаар уншина
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': 'ANTHROPIC_API_KEY', // Энд Vercel дээрх түлхүүр ажиллана
                        'anthropic-version': '2023-06-01',
                        'dangerously-allow-the-developer-to-if-they-must-bypass-cors-just-for-this-demo': 'true'
                    },
                    body: JSON.stringify({
                        model: "claude-3-5-sonnet-20240620",
                        max_tokens: 1024,
                        messages: [{
                            role: "user", 
                            content: `User name is ${name}. Please provide a psychological breakthrough coaching analysis for their current patterns.`
                        }]
                    })
                });

                const data = await response.json();
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('resultContent').innerHTML = data.content[0].text.replace(/\n/g, '<br>');
                document.getElementById('submitBtn').innerText = 'Analysis Complete';

            } catch (error) {
                console.error(error);
                alert('Connection error. Please ensure your Anthropic billing is active.');
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('app-container').classList.remove('opacity-50', 'pointer-events-none');
                document.getElementById('submitBtn').innerText = 'Begin Breakthrough Analysis';
            }
        }
    </script>
</body>
</html>
