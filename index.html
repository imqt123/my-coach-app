<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Breakthrough Engine | 2026 Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap');
        :root { --gold: #C5A059; --dark: #020202; }
        body { background-color: var(--dark); color: white; font-family: 'Inter', sans-serif; }
        .serif { font-family: 'Bodoni Moda', serif; }
        .gold-border { border: 1px solid rgba(197, 160, 89, 0.4); }
        .btn-gold { background: var(--gold); transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1); color: black; }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(197, 160, 89, 0.3); }
        .modal-bg { backdrop-filter: blur(20px); background: rgba(0,0,0,0.85); }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
        .scanner { height: 3px; background: var(--gold); position: absolute; width: 100%; animation: scan 2.5s infinite; box-shadow: 0 0 20px var(--gold); }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

    <nav class="p-8 flex justify-between items-center max-w-7xl mx-auto">
        <div class="serif text-3xl tracking-tighter font-bold text-[#C5A059]">B.E.</div>
        <button onclick="toggleLang()" id="langBtn" class="text-[10px] font-bold uppercase tracking-[0.3em] text-gray-400 border border-white/20 px-4 py-2 rounded-full hover:bg-white/10 transition-all">MN / EN</button>
    </nav>

    <main class="max-w-4xl mx-auto text-center pt-16 px-6">
        <h1 class="serif text-6xl md:text-8xl mb-8 leading-[1.1]" id="mainH1">Identify Your Blocks. <br><span class="italic text-gray-500">Rewrite Your Protocol.</span></h1>
        
        <div class="max-w-md mx-auto gold-border p-12 rounded-[2.5rem] bg-white/[0.03] shadow-2xl relative">
            <input type="text" id="userName" placeholder="Your Name / Таны нэр" class="w-full bg-transparent border-b border-white/20 mb-10 py-4 text-center text-2xl outline-none focus:border-[#C5A059] transition-all">
            <button onclick="openPayment()" class="w-full btn-gold font-black py-6 rounded-2xl uppercase tracking-[0.4em] text-[10px]">
                Initialize Analysis
            </button>
        </div>
    </main>

    <!-- QPay Modal -->
    <div id="paymentModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 modal-bg">
        <div class="max-w-sm w-full bg-[#080808] border border-white/10 p-10 rounded-[3rem] text-center shadow-3xl">
            <h2 class="serif text-3xl mb-8" id="modalTitle">Secure Checkout</h2>
            
            <div class="relative w-56 h-56 mx-auto mb-8 bg-white p-3 rounded-[2rem] shadow-inner overflow-hidden">
                <div class="scanner"></div>
                <!-- Verification: file name verbatim download.jpeg -->
                <img src="download.jpeg" alt="QPay" class="w-full h-full object-cover">
            </div>

            <div class="mb-10 space-y-2">
                <p class="text-[#C5A059] text-3xl font-light tracking-tighter">5,000₮</p>
                <p class="text-[11px] text-gray-500 uppercase tracking-widest leading-loose" id="paymentInstr">
                    Scan with QPay. <br> Use your name as description.
                </p>
            </div>

            <button onclick="startProcessing()" class="w-full bg-white text-black font-bold py-5 rounded-2xl uppercase tracking-widest text-[9px] hover:bg-gray-200">
                Verify Payment
            </button>
            <button onclick="closePayment()" class="mt-4 text-gray-600 text-[10px] uppercase tracking-widest hover:text-gray-400">Cancel</button>
        </div>
    </div>

    <!-- Final Report Section -->
    <div id="result" class="hidden max-w-4xl mx-auto mt-20 p-16 gold-border rounded-[3rem] bg-white/[0.02]">
        <div id="loading" class="text-center">
            <div class="inline-block animate-spin rounded-full h-16 w-16 border-t-2 border-[#C5A059] mb-8"></div>
            <p class="text-[10px] tracking-[0.5em] text-[#C5A059] uppercase animate-pulse">Neural Decoding in Progress...</p>
        </div>
        <div id="resultContent" class="serif text-2xl md:text-3xl leading-[1.9] text-gray-200"></div>
    </div>

    <script>
        let lang = 'EN';
        const ui = {
            EN: { h1: 'Identify Your Blocks. <br><span class="italic text-gray-500">Rewrite Your Protocol.</span>', modal: 'Secure Checkout', instr: 'Scan with QPay. <br> Use your name as description.' },
            MN: { h1: 'Далд саадаа оношил. <br><span class="italic text-gray-500">Протоколоо шинэчил.</span>', modal: 'Төлбөр төлөх', instr: 'QPay-ээр уншуулна уу. <br> Гүйлгээний утга дээр нэрээ бичнэ үү.' }
        };

        function toggleLang() {
            lang = lang === 'EN' ? 'MN' : 'EN';
            document.getElementById('mainH1').innerHTML = ui[lang].h1;
            document.getElementById('modalTitle').innerText = ui[lang].modal;
            document.getElementById('paymentInstr').innerHTML = ui[lang].instr;
        }

        function openPayment() {
            if (!document.getElementById('userName').value) return alert('Name required.');
            document.getElementById('paymentModal').classList.remove('hidden');
        }

        function closePayment() { document.getElementById('paymentModal').classList.add('hidden'); }

        async function startProcessing() {
            closePayment();
            const name = document.getElementById('userName').value;
            document.getElementById('result').classList.remove('hidden');
            window.scrollTo({top: document.getElementById('result').offsetTop, behavior: 'smooth'});

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                const data = await res.json();
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('resultContent').innerHTML = data.text;
            } catch (e) {
                alert("Neural link failed. Verify payment.");
            }
        }
    </script>
</body>
</html>
